<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Odômetro — Planejador de Viagens</title>

<!-- Tailwind CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<!-- Leaflet CSS & JS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Fonts: Space Grotesk (display), Inter (corpo), JetBrains Mono (dados) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- PWA Manifest -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B0F14">

<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          display: ['"Space Grotesk"', 'sans-serif'],
          sans: ['Inter', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'monospace'],
        },
        colors: {
          base: '#020617',
          elevated: '#0B1220',
          surface: '#111827',
          surface2: '#1E293B',
          edge: '#334155',
          accent: '#3B82F6',
          accent2: '#60A5FA',
          ok: '#34D399',
          danger: '#F87171',
          ink: '#F8FAFC',
          mute: '#94A3B8',
        }
      }
    }
  }
</script>

<style>
  * { -webkit-tap-highlight-color: transparent; }
  body {
    background-color: #020617;
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(37,99,235,0.12), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(79,70,229,0.08), transparent 55%);
    background-attachment: fixed;
    font-family: Inter, system-ui, sans-serif;
  }
  :focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(59,130,246,0.4); border-radius: 8px; }
  ::-webkit-scrollbar { height: 8px; width: 8px; }
  ::-webkit-scrollbar-track { background: #111820; }
  ::-webkit-scrollbar-thumb { background: #2b3742; border-radius: 4px; }

  .readout { font-variant-numeric: tabular-nums; letter-spacing: 0.01em; }

  .glow-accent { text-shadow: 0 0 18px rgba(59,130,246,0.35); }
  .glow-ok { text-shadow: 0 0 18px rgba(52,211,153,0.35); }

  input:focus, select:focus {
    outline: none;
    box-shadow: 0 0 0 2px rgba(59,130,246,0.45);
  }

  .tab-btn { transition: color .18s ease, background-color .18s ease; }

  .card-enter { animation: cardIn .35s ease both; }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .winner-card { box-shadow: 0 0 0 1px rgba(52,211,153,0.5), 0 0 24px rgba(52,211,153,0.12); }
  
  /* Map container height */
  .trip-map { height: 160px; border-radius: 12px; z-index: 1; }
  #mainMap { height: 300px; border-radius: 16px; margin-bottom: 20px; z-index: 1; }
</style>
</head>

<body class="min-h-screen font-sans text-ink antialiased">

  <!-- ===================== HEADER ===================== -->
  <header class="border-b border-edge/80 bg-elevated/60 backdrop-blur sticky top-0 z-20">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-surface2 border border-edge flex items-center justify-center shrink-0">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="5" cy="18" r="3"></circle>
              <circle cx="19" cy="18" r="3"></circle>
              <path d="M8.5 18h5l3-9h3M12 18l2-6h-4l-1.5 4"></path>
            </svg>
        </div>
        <div class="min-w-0">
            <h1 class="font-display font-700 text-lg sm:text-xl tracking-tight leading-none">ODÔMETRO</h1>
            <p class="text-[11px] sm:text-xs text-mute mt-0.5 truncate">Planejamento e comparação de viagens</p>
        </div>
      </div>
      <div id="installApp" class="hidden">
          <button class="text-xs bg-surface2 border border-edge px-3 py-1.5 rounded-lg hover:bg-edge transition">Instalar App</button>
      </div>
    </div>
    <div class="h-px w-full bg-[linear-gradient(90deg,transparent,transparent_4px,#25313C_4px,#25313C_8px)] bg-[length:8px_1px]"></div>
  </header>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-6 sm:py-8">

    <!-- ===================== TABS ===================== -->
    <div class="inline-flex p-1 rounded-xl bg-surface border border-edge mb-6 sm:mb-8">
      <button id="tabBtnManage" class="tab-btn px-4 sm:px-5 py-2 rounded-lg text-sm font-medium font-display">
        Minhas Viagens
      </button>
      <button id="tabBtnCompare" class="tab-btn px-4 sm:px-5 py-2 rounded-lg text-sm font-medium font-display">
        Comparar Viagens
      </button>
    </div>

    <!-- ===================== ABA 1: MINHAS VIAGENS ===================== -->
    <section id="panelManage">

      <!-- Formulário -->
      <form id="tripForm" class="bg-surface border border-edge rounded-2xl p-5 sm:p-6 mb-8 transition-all duration-300">
        <input type="hidden" id="fId">
        <div class="flex items-center justify-between mb-1">
          <h2 id="formTitle" class="font-display font-600 text-base sm:text-lg">Nova viagem</h2>
          <button type="button" id="btnCancelEdit" class="hidden text-xs text-danger hover:underline">Cancelar edição</button>
        </div>
        
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Coluna 1: Dados Básicos -->
            <div class="lg:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="sm:col-span-2">
                    <label class="block text-xs text-mute mb-1.5" for="fName">Nome da viagem</label>
                    <input required id="fName" type="text" placeholder="Ex: Rota do Sol"
                      class="w-full bg-surface2 border border-edge rounded-lg px-3 py-2.5 text-sm">
                </div>
                <div>
                    <label class="block text-xs text-mute mb-1.5" for="fOrigin">Origem</label>
                    <input required id="fOrigin" type="text" placeholder="Ex: Fortaleza, CE"
                      class="w-full bg-surface2 border border-edge rounded-lg px-3 py-2.5 text-sm">
                </div>
                <div>
                    <label class="block text-xs text-mute mb-1.5" for="fDest">Destino</label>
                    <input required id="fDest" type="text" placeholder="Ex: Natal, RN"
                      class="w-full bg-surface2 border border-edge rounded-lg px-3 py-2.5 text-sm">
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="block text-xs text-mute" for="fDist">Distância (ida+volta km)</label>
                        <button type="button" id="btnAutoDist" onclick="autoCalculateDistance()" class="text-[9px] text-accent hover:underline">Calcular Auto</button>
                    </div>
                    <input required id="fDist" type="number" min="0" step="0.1"
                      class="w-full bg-surface2 border border-edge rounded-lg px-3 py-2.5 text-sm font-mono">
                </div>
                <div>
                    <label class="block text-xs text-mute mb-1.5" for="fCons">Consumo (km/L)</label>
                    <input required id="fCons" type="number" min="0.1" step="0.1" value="29"
                      class="w-full bg-surface2 border border-edge rounded-lg px-3 py-2.5 text-sm font-mono">
                </div>
                <div>
                    <label class="block text-xs text-mute mb-1.5" for="fFuel">Preço Combustível (R$/L)</label>
                    <input required id="fFuel" type="number" min="0.01" step="0.01" value="6.15"
                      class="w-full bg-surface2 border border-edge rounded-lg px-3 py-2.5 text-sm font-mono">
                </div>
                <div>
                    <label class="block text-xs text-mute mb-1.5" for="fTravelers">Viajantes</label>
                    <input required id="fTravelers" type="number" min="1" value="1"
                      class="w-full bg-surface2 border border-edge rounded-lg px-3 py-2.5 text-sm font-mono">
                </div>
            </div>

            <!-- Coluna 2: Custos Adicionais e Paradas -->
            <div class="space-y-4">
                <div>
                    <h3 class="text-xs font-semibold text-mute uppercase tracking-wider mb-3">Custos Fixos</h3>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[10px] text-mute mb-1" for="fHosting">Hospedagem</label>
                            <input id="fHosting" type="number" min="0" value="0" class="w-full bg-surface2 border border-edge rounded-lg px-2 py-2 text-sm font-mono">
                        </div>
                        <div>
                            <label class="block text-[10px] text-mute mb-1" for="fFood">Alimentação</label>
                            <input id="fFood" type="number" min="0" value="0" class="w-full bg-surface2 border border-edge rounded-lg px-2 py-2 text-sm font-mono">
                        </div>
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-2">
                        <h3 class="text-xs font-semibold text-mute uppercase tracking-wider">Cronograma / Paradas</h3>
                        <button type="button" id="btnAddStop" class="text-[10px] text-accent hover:underline">+ Adicionar</button>
                    </div>
                    <div id="stopsContainer" class="space-y-2 max-h-40 overflow-y-auto pr-1">
                        <!-- Paradas dinâmicas aqui -->
                    </div>
                </div>
            </div>
        </div>

        <div class="flex flex-col sm:flex-row items-center justify-between mt-6 pt-5 border-t border-edge/70 gap-4">
          <div id="formPreview" class="text-xs text-mute font-mono"></div>
          <button type="submit" id="btnSubmit"
            class="w-full sm:w-auto inline-flex items-center justify-center gap-2 bg-accent text-base px-6 py-2.5 rounded-lg text-sm font-semibold font-display hover:brightness-110 active:scale-[0.98] transition">
            <span id="submitText">Salvar viagem</span>
          </button>
        </div>
      </form>

      <!-- Mapa Geral (Opcional) -->
      <div id="mainMap" class="hidden"></div>

      <!-- Lista de viagens -->
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-display font-600 text-base sm:text-lg">Viagens cadastradas</h2>
        <div class="flex items-center gap-3">
            <button id="btnExport" class="text-[10px] text-mute hover:text-accent flex items-center gap-1 border border-edge px-2 py-1 rounded transition">
                Exportar JSON
            </button>
            <span id="tripCount" class="text-xs text-mute font-mono"></span>
        </div>
      </div>

      <div id="tripList" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>

      <div id="emptyState" class="hidden text-center py-14 border border-dashed border-edge rounded-2xl">
        <p class="text-mute text-sm">Nenhuma viagem cadastrada ainda.</p>
      </div>

    </section>

    <!-- ===================== ABA 2: COMPARAR VIAGENS ===================== -->
    <section id="panelCompare" class="hidden">
      <!-- (Conteúdo de comparação permanece similar, mas atualizado para novos dados) -->
      <div class="bg-surface border border-edge rounded-2xl p-5 sm:p-6 mb-8">
        <h2 class="font-display font-600 text-base sm:text-lg mb-1">Comparar duas viagens</h2>
        <div class="grid grid-cols-1 sm:grid-cols-[1fr_auto_1fr] gap-4 items-end mt-4">
          <select id="selA" class="w-full bg-surface2 border border-edge rounded-lg px-3 py-2.5 text-sm"></select>
          <span class="font-display font-700 text-mute text-sm text-center">VS</span>
          <select id="selB" class="w-full bg-surface2 border border-edge rounded-lg px-3 py-2.5 text-sm"></select>
        </div>
        <button id="btnCompare" class="mt-5 bg-accent px-5 py-2.5 rounded-lg text-sm font-semibold font-display transition w-full sm:w-auto">Comparar</button>
      </div>
      <div id="compareResult" class="hidden overflow-x-auto">
        <div class="min-w-[560px] bg-surface border border-edge rounded-2xl overflow-hidden">
          <div id="compareHeader" class="grid grid-cols-[1fr_1fr_1fr] border-b border-edge"></div>
          <div id="compareRows"></div>
        </div>
      </div>
    </section>

  </main>

  <footer class="max-w-6xl mx-auto px-4 sm:px-6 pb-10 pt-4">
    <div class="h-px w-full bg-[linear-gradient(90deg,transparent,transparent_4px,#25313C_4px,#25313C_8px)] bg-[length:8px_1px] mb-4"></div>
    <p class="text-[11px] text-mute/70 text-center">Odômetro · Mu Finance — Dados salvos localmente.</p>
  </footer>

<script>
  // =========================================================
  // ESTADO E CONFIGURAÇÃO
  // =========================================================
  const STORAGE_KEY = 'odometro_trips_v2';
  let trips = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  let activeCharts = {};

  function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(trips)); }

  // =========================================================
  // UTILITÁRIOS
  // =========================================================
  const brl = v => (v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  const num = (v, d=1) => (v || 0).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
  const esc = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };

  // =========================================================
  // GESTÃO DE PARADAS (CRONOGRAMA)
  // =========================================================
  const stopsContainer = document.getElementById('stopsContainer');
  const btnAddStop = document.getElementById('btnAddStop');

  function createStopRow(name = '', cost = 0) {
    const div = document.createElement('div');
    div.className = 'flex gap-2 items-center animate-in fade-in slide-in-from-left-2 duration-200';
    div.innerHTML = `
        <input type="text" placeholder="Local/Gasto" value="${name}" class="stop-name flex-1 bg-surface2 border border-edge rounded-md px-2 py-1 text-[11px]">
        <input type="number" placeholder="R$" value="${cost}" class="stop-cost w-16 bg-surface2 border border-edge rounded-md px-2 py-1 text-[11px] font-mono">
        <button type="button" class="text-mute hover:text-danger remove-stop">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"></path></svg>
        </button>
    `;
    div.querySelector('.remove-stop').onclick = () => { div.remove(); updateFormPreview(); };
    div.querySelectorAll('input').forEach(i => i.oninput = updateFormPreview);
    stopsContainer.appendChild(div);
  }

  btnAddStop.onclick = () => createStopRow();

  function getStopsData() {
    return Array.from(stopsContainer.children).map(row => ({
        name: row.querySelector('.stop-name').value || 'Parada',
        cost: parseFloat(row.querySelector('.stop-cost').value) || 0
    }));
  }

  // =========================================================
  // CÁLCULOS
  // =========================================================
  function calculateTrip(trip) {
    const liters = trip.distance / (trip.consumption || 1);
    const fuelCost = liters * trip.fuelPrice;
    const stopsCost = (trip.stops || []).reduce((acc, s) => acc + s.cost, 0);
    const total = fuelCost + trip.hosting + trip.food + stopsCost;
    const travelers = parseInt(trip.travelers) || 1;
    
    return {
        liters,
        fuelCost,
        stopsCost,
        total,
        perPerson: total / travelers,
        breakdown: {
            'Combustível': fuelCost,
            'Hospedagem': trip.hosting,
            'Alimentação': trip.food,
            'Paradas/Extras': stopsCost
        }
    };
  }

  // =========================================================
  // GRÁFICOS (CHART.JS)
  // =========================================================
  function renderChart(canvasId, data) {
    const ctx = document.getElementById(canvasId).getContext('2d');
    
    // Destruir gráfico anterior se existir
    if (activeCharts[canvasId]) activeCharts[canvasId].destroy();

    activeCharts[canvasId] = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: Object.keys(data),
            datasets: [{
                data: Object.values(data),
                backgroundColor: ['#3B82F6', '#34D399', '#60A5FA', '#94A3B8'],
                borderWidth: 0,
                hoverOffset: 4
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false }
            },
            cutout: '70%'
        }
    });
  }

  // =========================================================
  // MAPAS E GEOLOCALIZAÇÃO
  // =========================================================
  async function geocode(address) {
    try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}&limit=1`);
        const data = await res.json();
        return data.length ? [parseFloat(data[0].lat), parseFloat(data[0].lon)] : null;
    } catch (e) { return null; }
  }

  async function initMiniMap(containerId, origin, dest) {
      const map = L.map(containerId, { zoomControl: false, attributionControl: false }).setView([-15, -50], 4);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
      
      const posA = await geocode(origin);
      const posB = await geocode(dest);
      
      if (posA && posB) {
          L.marker(posA).addTo(map);
          L.marker(posB).addTo(map);
          const line = L.polyline([posA, posB], { color: '#3B82F6', weight: 3, dashArray: '5, 10' }).addTo(map);
          map.fitBounds(line.getBounds(), { padding: [20, 20] });
      } else if (posA || posB) {
          const pos = posA || posB;
          map.setView(pos, 12);
          L.marker(pos).addTo(map);
      }
      return map;
  }

  async function autoCalculateDistance() {
      const origin = document.getElementById('fOrigin').value;
      const dest = document.getElementById('fDest').value;
      if (!origin || !dest) return alert('Preencha origem e destino primeiro.');
      
      const btn = document.getElementById('btnAutoDist');
      const originalText = btn.innerHTML;
      btn.innerHTML = '...';
      btn.disabled = true;

      const posA = await geocode(origin);
      const posB = await geocode(dest);

      if (posA && posB) {
          // Distância haversine simples (em km)
          const R = 6371;
          const dLat = (posB[0] - posA[0]) * Math.PI / 180;
          const dLon = (posB[1] - posA[1]) * Math.PI / 180;
          const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                    Math.cos(posA[0] * Math.PI / 180) * Math.cos(posB[0] * Math.PI / 180) * 
                    Math.sin(dLon/2) * Math.sin(dLon/2);
          const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
          const d = R * c;
          
          // Multiplicar por 1.2 para simular curvas da estrada (aproximação)
          document.getElementById('fDist').value = (d * 1.2 * 2).toFixed(1); // Ida e volta
          updateFormPreview();
      } else {
          alert('Não foi possível localizar os endereços.');
      }
      btn.innerHTML = originalText;
      btn.disabled = false;
  }

  // =========================================================
  // FORMULÁRIO E UI
  // =========================================================
  const tripForm = document.getElementById('tripForm');
  const formPreview = document.getElementById('formPreview');

  function updateFormPreview() {
    const dist = parseFloat(document.getElementById('fDist').value) || 0;
    const cons = parseFloat(document.getElementById('fCons').value) || 0;
    const fuel = parseFloat(document.getElementById('fFuel').value) || 0;
    const host = parseFloat(document.getElementById('fHosting').value) || 0;
    const food = parseFloat(document.getElementById('fFood').value) || 0;
    const travelers = parseInt(document.getElementById('fTravelers').value) || 1;
    const stops = getStopsData();
    
    const tripData = { distance: dist, consumption: cons, fuelPrice: fuel, hosting: host, food: food, travelers, stops };
    const res = calculateTrip(tripData);
    
    if (dist > 0) {
        formPreview.innerHTML = `Total: <span class="text-accent font-bold">${brl(res.total)}</span> • ${brl(res.perPerson)}/pessoa`;
    } else {
        formPreview.textContent = '';
    }
  }

  tripForm.querySelectorAll('input').forEach(i => i.oninput = updateFormPreview);

  tripForm.onsubmit = (e) => {
    e.preventDefault();
    const id = document.getElementById('fId').value;
    const trip = {
        id: id || 't_' + Date.now(),
        name: document.getElementById('fName').value,
        origin: document.getElementById('fOrigin').value,
        destination: document.getElementById('fDest').value,
        distance: parseFloat(document.getElementById('fDist').value),
        consumption: parseFloat(document.getElementById('fCons').value),
        fuelPrice: parseFloat(document.getElementById('fFuel').value),
        hosting: parseFloat(document.getElementById('fHosting').value),
        food: parseFloat(document.getElementById('fFood').value),
        travelers: parseInt(document.getElementById('fTravelers').value),
        stops: getStopsData(),
        createdAt: Date.now()
    };

    if (id) {
        const idx = trips.findIndex(t => t.id === id);
        trips[idx] = trip;
    } else {
        trips.unshift(trip);
    }
    
    save();
    renderList();
    resetForm();
  };

  function resetForm() {
      tripForm.reset();
      document.getElementById('fId').value = '';
      stopsContainer.innerHTML = '';
      document.getElementById('formTitle').textContent = 'Nova viagem';
      document.getElementById('btnCancelEdit').classList.add('hidden');
      updateFormPreview();
  }

  document.getElementById('btnCancelEdit').onclick = resetForm;

  // =========================================================
  // RENDERIZAÇÃO DA LISTA
  // =========================================================
  const tripList = document.getElementById('tripList');
  
  function renderList() {
    const count = document.getElementById('tripCount');
    count.textContent = trips.length ? `${trips.length} viagens` : '';
    
    if (!trips.length) {
        tripList.innerHTML = '';
        document.getElementById('emptyState').classList.remove('hidden');
        return;
    }
    document.getElementById('emptyState').classList.add('hidden');

    tripList.innerHTML = trips.map(t => {
        const res = calculateTrip(t);
        return `
        <article class="bg-surface border border-edge rounded-2xl overflow-hidden hover:border-accent/30 transition-all card-enter">
            <div id="map-${t.id}" class="trip-map bg-surface2/30"></div>
            
            <div class="p-5">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <h3 class="font-display font-bold text-lg leading-tight">${esc(t.name)}</h3>
                        <p class="text-xs text-mute">${esc(t.origin)} → ${esc(t.destination)}</p>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="editTrip('${t.id}')" class="p-2 hover:bg-surface2 rounded-lg text-mute hover:text-accent transition">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                        </button>
                        <button onclick="deleteTrip('${t.id}')" class="p-2 hover:bg-surface2 rounded-lg text-mute hover:text-danger transition">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6h16z"></path></svg>
                        </button>
                    </div>
                </div>

                <div class="flex gap-4 items-center mb-6">
                    <div class="w-20 h-20 shrink-0 relative">
                        <canvas id="chart-${t.id}"></canvas>
                        <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                            <span class="text-[10px] font-bold text-accent">${num(t.distance, 0)}k</span>
                        </div>
                    </div>
                    <div class="flex-1 grid grid-cols-2 gap-2">
                        <div class="bg-surface2/40 p-2 rounded-lg">
                            <p class="text-[9px] text-mute uppercase">Total</p>
                            <p class="text-xs font-mono font-bold text-accent">${brl(res.total)}</p>
                        </div>
                        <div class="bg-surface2/40 p-2 rounded-lg">
                            <p class="text-[9px] text-mute uppercase">Por Pessoa</p>
                            <p class="text-xs font-mono font-bold">${brl(res.perPerson)}</p>
                        </div>
                    </div>
                </div>

                ${(t.stops || []).length ? `
                <div class="border-t border-edge/50 pt-3 mt-3">
                    <p class="text-[10px] font-bold text-mute uppercase mb-2">Cronograma</p>
                    <div class="space-y-1">
                        ${(t.stops || []).map(s => `
                            <div class="flex justify-between text-[11px]">
                                <span class="text-ink/80">• ${esc(s.name)}</span>
                                <span class="text-mute font-mono">${brl(s.cost)}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
                ` : ''}
            </div>
        </article>
        `;
    }).join('');

    // Iniciar gráficos e mapas após renderizar o HTML
    trips.forEach(t => {
        const res = calculateTrip(t);
        renderChart(`chart-${t.id}`, res.breakdown);
        initMiniMap(`map-${t.id}`, t.origin, t.destination);
    });
  }

  window.editTrip = (id) => {
      const t = trips.find(x => x.id === id);
      if (!t) return;
      document.getElementById('fId').value = t.id;
      document.getElementById('fName').value = t.name;
      document.getElementById('fOrigin').value = t.origin;
      document.getElementById('fDest').value = t.destination;
      document.getElementById('fDist').value = t.distance;
      document.getElementById('fCons').value = t.consumption;
      document.getElementById('fFuel').value = t.fuelPrice;
      document.getElementById('fHosting').value = t.hosting;
      document.getElementById('fFood').value = t.food;
      document.getElementById('fTravelers').value = t.travelers;
      
      stopsContainer.innerHTML = '';
      (t.stops || []).forEach(s => createStopRow(s.name, s.cost));
      
      document.getElementById('formTitle').textContent = 'Editar Viagem';
      document.getElementById('btnCancelEdit').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
      updateFormPreview();
  };

  window.deleteTrip = (id) => {
      if (confirm('Excluir esta viagem?')) {
          trips = trips.filter(t => t.id !== id);
          save();
          renderList();
      }
  };

  // =========================================================
  // TABS E INIT
  // =========================================================
  const tabBtnManage = document.getElementById('tabBtnManage');
  const tabBtnCompare = document.getElementById('tabBtnCompare');
  const panelManage = document.getElementById('panelManage');
  const panelCompare = document.getElementById('panelCompare');

  function setTab(tab) {
    const managing = tab === 'manage';
    panelManage.classList.toggle('hidden', !managing);
    panelCompare.classList.toggle('hidden', managing);
    tabBtnManage.className = `tab-btn px-5 py-2 rounded-lg text-sm font-medium font-display ${managing ? 'bg-accent text-base' : 'text-mute hover:text-ink'}`;
    tabBtnCompare.className = `tab-btn px-5 py-2 rounded-lg text-sm font-medium font-display ${!managing ? 'bg-accent text-base' : 'text-mute hover:text-ink'}`;
  }

  tabBtnManage.onclick = () => setTab('manage');
  tabBtnCompare.onclick = () => { setTab('compare'); populateCompareSelects(); };

  function populateCompareSelects() {
    const opts = trips.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('');
    const selA = document.getElementById('selA');
    const selB = document.getElementById('selB');
    if (selA) selA.innerHTML = opts || '<option value="">Nenhuma viagem</option>';
    if (selB) selB.innerHTML = opts || '<option value="">Nenhuma viagem</option>';
    if (trips.length > 1 && selB) selB.selectedIndex = 1;
  }

  document.getElementById('btnCompare').onclick = () => {
    const idA = document.getElementById('selA').value;
    const idB = document.getElementById('selB').value;
    if (!idA || !idB) return alert('Selecione duas viagens.');
    if (idA === idB) return alert('Selecione viagens diferentes.');
    const a = trips.find(t => t.id === idA);
    const b = trips.find(t => t.id === idB);
    if (!a || !b) return;
    const ra = calculateTrip(a);
    const rb = calculateTrip(b);
    const cheaper = ra.total <= rb.total ? a : b;
    const header = document.getElementById('compareHeader');
    const rows = document.getElementById('compareRows');
    header.innerHTML = `
      <div class="p-3 text-xs text-mute font-bold uppercase">Métrica</div>
      <div class="p-3 text-sm font-display font-bold ${cheaper.id===a.id?'text-ok':''}">${esc(a.name)}</div>
      <div class="p-3 text-sm font-display font-bold ${cheaper.id===b.id?'text-ok':''}">${esc(b.name)}</div>`;
    const metrics = [
      ['Distância (km)', num(a.distance,1), num(b.distance,1)],
      ['Consumo (km/L)', num(a.consumption,1), num(b.consumption,1)],
      ['Combustível', brl(ra.fuelCost), brl(rb.fuelCost)],
      ['Hospedagem', brl(a.hosting), brl(b.hosting)],
      ['Alimentação', brl(a.food), brl(b.food)],
      ['Paradas/Extras', brl(ra.stopsCost), brl(rb.stopsCost)],
      ['Total', brl(ra.total), brl(rb.total)],
      ['Por pessoa', brl(ra.perPerson), brl(rb.perPerson)],
      ['Viajantes', String(a.travelers||1), String(b.travelers||1)],
    ];
    rows.innerHTML = metrics.map((m, i) => `
      <div class="grid grid-cols-[1fr_1fr_1fr] border-b border-edge ${i===metrics.length-3?'bg-surface2/40 font-bold':''}">
        <div class="p-3 text-xs text-mute">${m[0]}</div>
        <div class="p-3 text-sm font-mono">${m[1]}</div>
        <div class="p-3 text-sm font-mono">${m[2]}</div>
      </div>`).join('') + `
      <div class="p-4 text-center text-sm">
        Mais econômica: <strong class="text-ok">${esc(cheaper.name)}</strong>
        (economia de ${brl(Math.abs(ra.total - rb.total))})
      </div>`;
    document.getElementById('compareResult').classList.remove('hidden');
  };

  document.getElementById('btnExport').onclick = () => {
    const blob = new Blob([JSON.stringify(trips, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'odometro-viagens.json';
    a.click();
    URL.revokeObjectURL(a.href);
  };

  setTab('manage');
  renderList();
  
  // PWA Service Worker e Instalação
  let deferredPrompt;
  const installBtn = document.getElementById('installApp');

  if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').then(reg => {
              console.log('SW registrado');
          }).catch(err => console.log('Erro SW', err));
      });
  }

  window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.classList.remove('hidden');
  });

  installBtn.onclick = async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') installBtn.classList.add('hidden');
      deferredPrompt = null;
  };
</script>

</body>
</html>
